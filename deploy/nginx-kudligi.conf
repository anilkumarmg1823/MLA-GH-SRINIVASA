# Kudligi MLA — nginx reverse proxy (HTTP for IP testing)
# Install on EC2:
#   sudo cp deploy/nginx-kudligi.conf /etc/nginx/sites-available/kudligi
#   sudo ln -sf /etc/nginx/sites-available/kudligi /etc/nginx/sites-enabled/kudligi
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# After you buy a domain, replace server_name _ with your domain and add Certbot SSL.

upstream kudligi_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream kudligi_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

# Rate-limit API / login abuse (shared memory zone)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Security headers (baseline; HSTS after HTTPS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # API → Express (PM2 kudligi-api)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://kudligi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Login path rate limit (still served by Next)
    location = /login {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://kudligi_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health for ALB / uptime checks
    location = /health {
        proxy_pass http://kudligi_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Next.js frontend (PM2 kudligi-web)
    location / {
        proxy_pass http://kudligi_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}
